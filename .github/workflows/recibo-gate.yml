name: Integridade dos testes

# Confere, em segundos, que nenhum teste foi enfraquecido (regra 8 do AGENTS.md) e, em PR contra
# uma release, a seção `## Homologação` (ADR-052). O recibo `E2E-GATE:` do gate local foi
# aposentado (ADR-098, que supera o ADR-042): o E2E e a mutação rodam no Actions, em `gate-pr.yml`.
# O nome do arquivo e o id do job (`recibo-gate`) ficam por compatibilidade com testes e documentos;
# o check exigido na `main` é o nome do job abaixo.
# Roda também quando o corpo do PR é editado (`edited`), que é onde o `TESTE-ALTERADO:` e a
# seção de homologação são escritos.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # Merge queue (ADR-087): a integridade e a homologação já foram conferidas no PR (corpo do PR); na fila o
  # job é pulado, e check pulado conta como aprovado para o ruleset.
  merge_group:

concurrency:
  group: recibo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recibo-gate:
    if: github.event_name == 'pull_request'
    name: Integridade dos testes e homologação
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Tudo que vem do evento vai por variável de ambiente, nunca interpolado no script.
      - name: Corpo do PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"

      - name: Integridade dos testes (regra 8)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx tsx scripts/gate/check-test-integrity.ts "origin/$BASE_REF" --body-file "$RUNNER_TEMP/pr-body.txt"

      - name: Seed e cenários de homologação (ADR-052)
        if: startsWith(github.base_ref, 'release/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx tsx scripts/release/check-homologacao.ts --body-file "$RUNNER_TEMP/pr-body.txt" --base "origin/$BASE_REF"
