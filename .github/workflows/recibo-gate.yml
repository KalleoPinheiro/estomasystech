name: Recibo do gate

# Confere, em segundos, que o E2E (que não roda mais no Actions) rodou localmente para o
# commit atual e que nenhum teste foi enfraquecido (regra 7 e 8 do AGENTS.md, ADR-042).
# O recibo é exigido só no PR que entra na `main` (`release/* → main` ou `hotfix/* → main`);
# Dispensado quando o PR toca só `.md` de documentação (ADR-053).
# `feat/* → release/*` roda a integridade dos testes e a seção de homologação (ADR-052).
# Roda também quando o corpo do PR é editado (`edited`), que é onde o recibo e o
# `TESTE-ALTERADO:` são colados.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: recibo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recibo-gate:
    name: Recibo do gate local + integridade dos testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Tudo que vem do evento vai por variável de ambiente, nunca interpolado no script.
      - name: Corpo do PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"

      # PR só de `.md` de documentação dispensa o recibo (ADR-053); qualquer outro arquivo o exige.
      - name: Classificar o diff (só documentação?)
        id: classe
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: npx tsx scripts/release/docs-only.ts --base "origin/$BASE_REF" --head "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Recibo do gate local no corpo do PR
        if: github.base_ref == 'main' && steps.classe.outputs.docs_only != 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: npx tsx scripts/gate/verify-receipt.ts --body-file "$RUNNER_TEMP/pr-body.txt" --head-sha "$HEAD_SHA" --base-ref "origin/$BASE_REF" --head-ref "$HEAD_REF"

      - name: Integridade dos testes (regra 8)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx tsx scripts/gate/check-test-integrity.ts "origin/$BASE_REF" --body-file "$RUNNER_TEMP/pr-body.txt"

      - name: Seed e cenários de homologação (ADR-052)
        if: startsWith(github.base_ref, 'release/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx tsx scripts/release/check-homologacao.ts --body-file "$RUNNER_TEMP/pr-body.txt" --base "origin/$BASE_REF"
