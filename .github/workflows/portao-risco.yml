name: Portão de risco

# Classe de risco da PR (0 a 3; `docs/engineering/classe-de-risco.md`). Na classe 3, a aprovação do dono
# pelo Environment `aprovacao-classe-3` (ADR-097, ADR-098). O agente não clica.
#
# O classificador (`scripts/release/classificar-risco*.ts`) e o `check-migracao*.ts` vêm do checkout de
# `base.sha`, nunca do head. O head entra só como objeto (`--head`, diff `-z`, `git cat-file`): sem
# checkout dele, sem `npm ci` dele, sem execução. No `pull_request` o YAML ainda é o do merge: uma PR
# que edita este arquivo pode desligar isso. Fechar exige ruleset (decisão do Kalléo). Sem segredo.
# `permissions: contents: read`. Rascunho reprova (ADR-093).
on:
  pull_request:
    branches: ["release/**", main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue (ADR-087): a aprovação vale por execução da PR; na fila o portão apenas passa.
  merge_group:

concurrency:
  group: portao-risco-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  risco:
    name: Classe de risco
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      classe: ${{ steps.r.outputs.classe }}
      humana: ${{ steps.r.outputs.aprovacao_humana }}
    steps:
      - name: Base confiável
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Head só como objeto
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          sha() {
            case "$1" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
              *) echo "::error::$2 não é um SHA de 40 hex"; exit 1 ;;
            esac
          }
          sha "$BASE_SHA" base
          sha "$HEAD_SHA" head
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "::error::número da PR inválido"; exit 1 ;;
          esac
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          git cat-file -e "$HEAD_SHA^{commit}"

      - id: r
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run --silent check:risco -- --saida-github --base "$BASE_SHA" --head "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Classe de risco"
            npm run --silent check:risco -- --base "$BASE_SHA" --head "$HEAD_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  # Só roda na classe 3 e fica parado até o dono aprovar no Environment; a aprovação vale por execução
  # (push novo reinicia). O agente não tem como clicar. O SHA registrado é o do head da PR.
  aprovacao-classe-3:
    name: Aprovação do dono (classe 3)
    needs: risco
    if: needs.risco.outputs.humana == 'true'
    environment: aprovacao-classe-3
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "dono aprovou a classe 3 para $PR_SHA"

  portao-risco:
    name: Portão de risco
    if: always()
    needs: [risco, aprovacao-classe-3]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Conferir
        env:
          EVENTO: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          R_RISCO: ${{ needs.risco.result }}
          HUMANA: ${{ needs.risco.outputs.humana }}
          R_APROVACAO: ${{ needs.aprovacao-classe-3.result }}
        run: |
          if [ "$EVENTO" = merge_group ]; then echo "fila: a aprovação já foi dada na PR"; exit 0; fi
          if [ "$DRAFT" = true ]; then
            echo "::error::PR em rascunho: o portão de risco roda quando o PR for marcado como pronto (ADR-093)"; exit 1
          fi
          [ "$R_RISCO" = success ] || { echo "::error::classe de risco: $R_RISCO"; exit 1; }
          case "$HUMANA" in true|false) ;; *) echo "::error::aprovacao_humana ausente ou inválida: '$HUMANA'"; exit 1 ;; esac
          if [ "$HUMANA" = true ]; then
            [ "$R_APROVACAO" = success ] || { echo "::error::classe 3 sem a aprovação do dono ($R_APROVACAO)"; exit 1; }
          else
            [ "$R_APROVACAO" = skipped ] || { echo "::error::aprovação rodou sem classe 3 ($R_APROVACAO)"; exit 1; }
          fi
          echo "ok: aprovacao_humana=$HUMANA"
