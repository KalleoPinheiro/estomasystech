name: Gate do PR

# O gate incremental por PR (ADR-084, perfil `pr`) como workflow, em jobs paralelos (ADR-087): integração em
# Postgres real, E2E de produção em 3 shards do Playwright e E2E de dev (papéis + login) e console limpo.
# A suíte unitária completa com cobertura, o typecheck, o lint e o build ficam em `ci.yml`.
#
# ADR-098 (supera o ADR-042 e a saída da mutação do ADR-093): o E2E e a mutação por arquivo alterado voltam ao
# Actions como parte do check obrigatório "Gate do PR", também no PR contra a `main` (`release/*` e `hotfix/*`).
# O repositório é público e os runners padrão não gastam cota. Não há mais recibo `E2E-GATE:` no corpo do PR.
#
# ADR-093 (política de rascunho, que segue valendo): PR em rascunho roda só a política e o agregador, que
# reprova (fail-closed). A rodada completa vem no ready_for_review.
#
# Seleção: scripts/gate-cloud/impacto.ts decide o que o diff alcança («na dúvida, inclui»). Nada é pulado
# por conveniência: o job final `gate-pr` reprova se um job que devia rodar não passou.
on:
  pull_request:
    branches: ["release/**", main]
    # ADR-093: rascunho não paga o gate completo; ready_for_review dispara a rodada no mesmo SHA.
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue (ADR-087): a fila monta o SHA com os PRs à frente e o gate roda nele.
  merge_group:

concurrency:
  group: gate-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AUTH_SECRET: ci-placeholder-secret-0000000000000000
  NODE_OPTIONS: --max-old-space-size=8192
  TZ: UTC

jobs:
  # ADR-093: PR em rascunho roda só esta política e o agregador, que reprova. Assim nenhum
  # sucesso de rascunho fica no SHA quando o PR vira pronto: a rodada do ready_for_review decide.
  # O nome e a saída `completo` ficam estáveis para um job `rota` futuro absorver esta política.
  politica:
    name: Política (rascunho ou pronto)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      completo: ${{ steps.p.outputs.completo }}
    steps:
      - id: p
        env:
          EVENTO: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENTO" = pull_request ] && [ "$DRAFT" = true ]; then completo=false; else completo=true; fi
          echo "completo=$completo" >> "$GITHUB_OUTPUT"
          echo "evento=$EVENTO rascunho=${DRAFT:-n/a} gate completo=$completo" >> "$GITHUB_STEP_SUMMARY"

  impacto:
    name: Impacto do diff
    needs: politica
    if: needs.politica.outputs.completo == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      so_doc: ${{ steps.sel.outputs.so_doc }}
      e2e: ${{ steps.sel.outputs.e2e }}
      rodar_e2e: ${{ steps.sel.outputs.rodar_e2e }}
      mutacao: ${{ steps.sel.outputs.mutacao }}
      rodar_mutacao: ${{ steps.sel.outputs.rodar_mutacao }}
      rodar_compat: ${{ steps.sel.outputs.rodar_compat }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --ignore-scripts

      - id: sel
        env:
          # Em PR a base é a release; na fila, o SHA da base que a fila usou (já em `fetch-depth: 0`).
          GATE_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
          BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
          ALVO: ${{ github.base_ref }}
          ORIGEM: ${{ github.head_ref }}
        run: |
          # Mesma regra do ADR-053 (scripts/release/docs-only.ts): só documentação não paga integração nem E2E.
          so_doc=$(npx tsx scripts/release/docs-only.ts --base "$BASE_REF" --head HEAD | cut -d= -f2)
          if [ "$so_doc" = true ]; then
            e2e=NONE
          else
            e2e=$(npx tsx scripts/gate-cloud/impacto.ts)
          fi
          rodar_e2e=true
          if [ "$so_doc" = true ] || [ "$e2e" = NONE ]; then rodar_e2e=false; fi
          # Mutação só nos arquivos de regra alterados (ADR-051). No PR `release/* → main` (lote inteiro) ela já
          # rodou em cada PR do lote e roda inteira na rotina mensal: o diff da release não a repete. O `hotfix/*`
          # vai direto à `main` sem lote anterior: a mutação roda nele.
          mutacao=""
          if [ "$so_doc" != true ] && { [ "$ALVO" != main ] || [ "${ORIGEM#release/}" = "$ORIGEM" ]; }; then
            mutacao=$(npx tsx scripts/gate-cloud/impacto.ts --mutacao)
          fi
          rodar_mutacao=true
          if [ -z "$mutacao" ]; then rodar_mutacao=false; fi
          # Compatibilidade da migração (#760): só quando o diff toca drizzle/*.sql.
          rodar_compat=$(bash scripts/release/compat-migracao.sh precisa "$BASE_REF" | cut -d= -f2)
          {
            echo "so_doc=$so_doc"
            echo "e2e=$e2e"
            echo "rodar_e2e=$rodar_e2e"
            echo "mutacao=$mutacao"
            echo "rodar_mutacao=$rodar_mutacao"
            echo "rodar_compat=$rodar_compat"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Impacto do diff"
            echo "- só documentação: $so_doc"
            echo "- E2E: \`$e2e\`"
            echo "- mutação: \`${mutacao:-nenhum arquivo de regra alterado}\`"
            echo "- compatibilidade da migração: $rodar_compat"
          } >> "$GITHUB_STEP_SUMMARY"

  integracao:
    name: Integração (Postgres 18)
    needs: impacto
    if: needs.impacto.outputs.so_doc != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: gate
          POSTGRES_DB: estomas_integ
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://postgres:gate@127.0.0.1:5432/estomas_integ
      PG_POOL_MAX: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Suíte inteira: o job corre em paralelo com os demais e não está no caminho crítico (na dúvida, inclui).
      - run: npx vitest run -c vitest.integracao.config.mts

  # Issue #760: o código do commit anterior (base) roda a suíte de integração sobre o esquema novo (drizzle/ do
  # HEAD). Prova que a migração é compatível com o rollback; o lint `check:migracao` só presume. Só roda quando o
  # diff toca drizzle/*.sql. Postgres 18 descartável, como o job `integracao`.
  compat-migracao:
    name: Compatibilidade da migração (Postgres 18)
    needs: impacto
    if: needs.impacto.outputs.rodar_compat == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: gate
          POSTGRES_DB: estomas_integ
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://postgres:gate@127.0.0.1:5432/estomas_integ
      PG_POOL_MAX: "1"
      GATE_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Suíte de integração da base sobre o esquema novo
        run: bash scripts/release/compat-migracao.sh rodar "$GATE_BASE"

  # Um build só para os 3 shards do E2E de produção (antes cada shard fazia o seu: 3 builds por PR).
  # `.next/cache` fica de fora do artefato: o `next start` não o usa.
  build-prod:
    name: Build de produção (compartilhado)
    needs: impacto
    if: needs.impacto.outputs.rodar_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - run: npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-next
          path: |
            .next
            !.next/cache
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  e2e-prod:
    name: E2E produção (shard ${{ matrix.shard }}/3)
    needs: [impacto, build-prod]
    if: needs.impacto.outputs.rodar_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-next
          path: .next

      # Selecionado: todos os specs (ALL) ou só a lista do impacto, sempre com o console limpo.
      - name: Playwright (shard)
        env:
          SEL: ${{ needs.impacto.outputs.e2e }}
        run: |
          if [ "$SEL" = ALL ]; then sel=""; else sel="$SEL e2e/console-limpo.spec.ts"; fi
          # shellcheck disable=SC2086
          npx playwright test -c playwright.prod.config.ts --pass-with-no-tests --shard=${{ matrix.shard }}/3 $sel

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-prod-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-dev:
    name: E2E dev (papéis, login e console limpo)
    needs: impacto
    if: needs.impacto.outputs.rodar_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Playwright dev
        env:
          SEL: ${{ needs.impacto.outputs.e2e }}
        run: |
          if [ "$SEL" = ALL ]; then sel=""; else sel="$SEL e2e/console-limpo.spec.ts"; fi
          # shellcheck disable=SC2086
          npx playwright test --pass-with-no-tests $sel

      - name: Console limpo (dev)
        run: npx playwright test -c playwright.console.config.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-dev
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Mutação por arquivo alterado em domain/application/lib/server (ADR-051, ADR-098): Stryker incremental, com o
  # `break` de `stryker.config.json` valendo sobre o conjunto. A lista vem do job `impacto` por variável de
  # ambiente, nunca interpolada no script. O cache do arquivo incremental é o mesmo da rodada mensal.
  mutacao:
    name: Mutação (arquivos alterados)
    needs: impacto
    if: needs.impacto.outputs.rodar_mutacao == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Cache incremental do Stryker
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: stryker-incremental-

      - name: Stryker (só os arquivos alterados)
        env:
          ALVOS: ${{ needs.impacto.outputs.mutacao }}
        run: npm run test:mutacao -- --incremental --mutate "$ALVOS"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: relatorio-mutacao-pr
          path: reports/mutation/
          retention-days: 7

  # `build-prod` não entra aqui: se ele falhar, `e2e-prod` fica `skipped` e este agregador reprova.
  # Único check a exigir deste workflow (se o ruleset passar a exigir). Reprova se um job que devia rodar
  # não passou; só aceita `skipped` quando o impacto mandou pular. Em rascunho reprova de propósito.
  gate-pr:
    name: Gate do PR
    if: always()
    needs: [politica, impacto, integracao, compat-migracao, e2e-prod, e2e-dev, mutacao]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Conferir
        env:
          R_POLITICA: ${{ needs.politica.result }}
          COMPLETO: ${{ needs.politica.outputs.completo }}
          SO_DOC: ${{ needs.impacto.outputs.so_doc }}
          RODAR_E2E: ${{ needs.impacto.outputs.rodar_e2e }}
          R_IMPACTO: ${{ needs.impacto.result }}
          R_INTEGRACAO: ${{ needs.integracao.result }}
          R_PROD: ${{ needs.e2e-prod.result }}
          R_DEV: ${{ needs.e2e-dev.result }}
          R_MUTACAO: ${{ needs.mutacao.result }}
          RODAR_MUTACAO: ${{ needs.impacto.outputs.rodar_mutacao }}
          R_COMPAT: ${{ needs.compat-migracao.result }}
          RODAR_COMPAT: ${{ needs.impacto.outputs.rodar_compat }}
        run: |
          falhou=0
          conferir() { # <nome> <resultado> <devia rodar: true|false>
            if [ "$3" = true ] && [ "$2" != success ]; then echo "::error::$1: $2 (devia passar)"; falhou=1;
            elif [ "$3" != true ] && [ "$2" != skipped ]; then echo "::error::$1: $2 (devia ser pulado)"; falhou=1;
            else echo "$1: $2"; fi
          }
          [ "$R_POLITICA" = success ] || { echo "::error::politica: $R_POLITICA"; exit 1; }
          if [ "$COMPLETO" != true ]; then
            echo "::error::PR em rascunho: o gate completo roda quando o PR for marcado como pronto (ADR-093)"; exit 1
          fi
          [ "$R_IMPACTO" = success ] || { echo "::error::impacto: $R_IMPACTO"; exit 1; }
          conferir integracao "$R_INTEGRACAO" "$([ "$SO_DOC" = true ] && echo false || echo true)"
          conferir e2e-prod "$R_PROD" "$RODAR_E2E"
          conferir e2e-dev "$R_DEV" "$RODAR_E2E"
          conferir mutacao "${R_MUTACAO:-skipped}" "${RODAR_MUTACAO:-false}"
          conferir compat-migracao "${R_COMPAT:-skipped}" "${RODAR_COMPAT:-false}"
          exit $falhou
