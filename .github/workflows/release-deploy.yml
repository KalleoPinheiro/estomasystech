name: Release deploy

# Publicar em produção com um clique (ADR-095, #750 a #752 e #851). Só `workflow_dispatch`, disparado da `main`
# ("Use workflow from" = main, ADR-092), porque a definição do workflow (que usa o PAT da tag e os segredos
# de produção) tem de vir da `main` protegida. Este workflow NÃO mergeia e NÃO faz push em branch.
#
# Ordem: `validar` (sem segredo de produção) -> clique do dono no Environment `producao` -> `producao` (backup,
# tag, deploy) -> `fumaca`.
# - `validar`: disparo na main, versão em package.json e CHANGELOG e (#851) a staging automática já validou este
#   SHA exato da main (workflow Staging, evento push, concluído com sucesso). Sem isso nada é publicado.
# - `producao` (Environment `producao`: revisor único, só `main`): o clique de aprovação é o único ato humano.
#   Confere que a main não avançou depois do disparo, faz o backup no VPS (só segue com `BACKUP_OK`), publica
#   a tag e a Release (`release:publish`, idempotente) e deploya pela API do Coolify, conferindo que o commit
#   implantado é o SHA validado. Falha em qualquer passo para ali: nunca há rollback automático (ADR-039).
# - `fumaca`: `scripts/release/fumaca-producao.sh` contra o domínio público, conferindo a versão publicada.
# - `dry_run`: só o `validar`; a fumaça roda sem conferir versão. Não toca produção nem cria tag.
#
# Segredo nunca entra em `run:`: vai por `env:` do passo. Nada de `set -x`. Sem `pull_request_target`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (X.Y.Z), a mesma do package.json da main"
        type: string
        required: true
      rollback:
        description: "Estratégia de rollback registrada na release (ADR-039)"
        type: choice
        options: [redeploy, backup]
        default: redeploy
      dry_run:
        description: "Só conferências: sem backup, tag, deploy nem Release; a fumaça não confere a versão"
        type: boolean
        default: false

concurrency:
  group: release-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validar:
    name: Validar (main, versão e staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      # ADR-092: primeiro passo, antes do checkout. Disparo errado é vermelho, nunca job pulado.
      - name: Validar o disparo (main + versão)
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != refs/heads/main ]; then
            echo "::error title=Disparo fora da main::A publicação é disparada da main (ref atual: $WORKFLOW_REF). Em Use workflow from escolha main (ADR-092)."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Versão inválida::O input version deve ser X.Y.Z (recebido: '$VERSION')."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Conferir que a main traz a versão
        shell: bash
        env:
          DISPARO_SHA: ${{ github.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$DISPARO_SHA" ]; then
            echo "::error title=A main avançou::A main mudou depois do disparo ($DISPARO_SHA -> $head). Dispare de novo."
            exit 1
          fi
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$VERSION" ]; then
            echo "::error title=Versão divergente::package.json da main traz $pkg, não $VERSION."
            exit 1
          fi
          if ! grep -Eq "^## \[?$VERSION\]?( |$)" CHANGELOG.md; then
            echo "::error title=CHANGELOG sem a versão::CHANGELOG.md não tem a seção $VERSION."
            exit 1
          fi

      # #851: só se publica o SHA exato que a staging automática validou (workflow Staging, push na main,
      # concluído com sucesso = deploy, health e validação logada verdes).
      - name: Conferir que a staging validou este SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          ok="$(gh api "repos/${GH_REPO}/actions/workflows/staging.yml/runs?head_sha=${SHA}&event=push&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error title=SHA sem validação da staging::A staging automática não tem execução verde para ${SHA}. Espere o workflow Staging terminar (ou corrija o que falhou) e dispare de novo."
            exit 1
          fi
          echo "A staging validou ${SHA}."

  producao:
    name: Produção (backup, tag e deploy)
    needs: validar
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # O clique do dono: revisor único, só a main (ADR-095, decisão do dono 1). Os segredos de produção são
    # deste Environment e entram só nos passos que os usam.
    environment: producao
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      ROLLBACK: ${{ inputs.rollback }}
      GH_REPO: ${{ github.repository }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Exigir os segredos de produção
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          GH_TOKEN: ${{ secrets.RELEASE_CUT_TOKEN }}
        run: |
          faltam=""
          for nome in VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_HOST COOLIFY_URL COOLIFY_TOKEN COOLIFY_APP_UUID; do
            [ -n "${!nome}" ] || faltam="$faltam $nome"
          done
          [ -n "$GH_TOKEN" ] || faltam="$faltam RELEASE_CUT_TOKEN"
          if [ -n "$faltam" ]; then
            echo "::error title=Segredo ausente::Crie no Environment producao (RELEASE_CUT_TOKEN no repositório):$faltam"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # A aprovação pode demorar: se a main andou desde o disparo, o SHA validado pela staging não é mais o HEAD.
      - name: Conferir que a main não avançou
        shell: bash
        env:
          VALIDADO_SHA: ${{ github.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$VALIDADO_SHA" ]; then
            echo "::error title=A main avançou::A main mudou depois do disparo ($VALIDADO_SHA -> $head). Nada foi publicado; dispare de novo."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      # npm fixo (ADR-091): o do `packageManager` do package.json.
      - name: Fixar o npm do package.json
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      # ADR-039: sem backup confirmado, nada é publicado nem deployado.
      - name: Backup no VPS (BACKUP_OK)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/release/backup-vps.sh

      # O PAT existe só neste passo (env do passo, nunca do job) e não fica no .git/config: o git o recebe do
      # credential helper do gh, que lê o GH_TOKEN.
      - name: Publicar tag e Release (release:publish)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CUT_TOKEN }}
        run: |
          gh auth setup-git
          npm run release:publish -- --rollback="$ROLLBACK"

      - name: Deploy pela API do Coolify (commit conferido)
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          ESPERADO_SHA: ${{ github.sha }}
        run: bash scripts/release/deploy-coolify.sh

  fumaca:
    name: Fumaça de produção
    needs: [validar, producao]
    # No dry_run o `producao` é pulado: a fumaça roda mesmo assim, sem conferir versão.
    if: ${{ !cancelled() && needs.validar.result == 'success' && (needs.producao.result == 'success' || needs.producao.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FUMACA_URL: ${{ vars.PRODUCAO_URL || 'https://estomasystech.kalleopinheiro.com.br' }}
      CONFERIR_VERSAO: ${{ !inputs.dry_run }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Fumaça somente leitura (producao.md § 9.6)
        shell: bash
        run: |
          if [ "$CONFERIR_VERSAO" = true ]; then
            export FUMACA_VERSAO="$VERSION"
          fi
          bash scripts/release/fumaca-producao.sh
