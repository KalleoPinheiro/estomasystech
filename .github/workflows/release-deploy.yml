name: Release deploy

# Publicar em produção com um clique (ADR-095, #750 a #752 e #851). Só `workflow_dispatch`, disparado da `main`
# ("Use workflow from" = main, ADR-092), porque a definição do workflow (que usa o PAT da tag e os segredos
# de produção) tem de vir da `main` protegida. Este workflow NÃO mergeia e NÃO faz push em branch.
#
# Ordem: `validar` (sem segredo de produção; confere o disparo, a staging e ENSAIA a migração num Postgres
# descartável) -> clique do dono no Environment `producao` -> `producao` -> `fumaca`.
# - `validar`: disparo na main, versão em package.json e CHANGELOG, a staging automática já validou este SHA exato
#   (#851) e o ensaio da migração (ADR-113): o mesmo caminho de produção, do banco da versão anterior ao esquema
#   novo, com os hashes conferidos contra o migrador do drizzle-orm. Sem isso nada é publicado.
# - `producao` (Environment `producao`: revisor único, só `main`): o clique de aprovação é o único ato humano.
#   Confere que a main não avançou; confere o canal de migração e que o token do Coolify consegue reverter;
#   faz o backup no VPS (só segue com `BACKUP_OK`); MIGRA O BANCO COM O DONO antes de trocar o container (se
#   a migração falha, para ali, sem deploy); deploya pela API do Coolify conferindo o SHA; roda a fumaça com
#   a versão; se a fumaça reprova, REVERTE a imagem para a versão anterior (banco intocado) e deixa o run
#   vermelho; só com a fumaça verde publica a tag e a Release (`release:publish`, idempotente).
# - `fumaca`: `scripts/release/fumaca-producao.sh` contra o domínio público, conferindo a versão publicada.
# - `dry_run`: só o `validar` (inclui o ensaio da migração); a fumaça roda sem conferir versão. Não toca produção,
#   não pede aprovação e não cria tag.
#
# Segredo nunca entra em `run:`: vai por `env:` do passo. Nada de `set -x`. Sem `pull_request_target`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (X.Y.Z), a mesma do package.json da main"
        type: string
        required: true
      rollback:
        description: "Estratégia de rollback registrada na release (ADR-039)"
        type: choice
        options: [redeploy, backup]
        default: redeploy
      dry_run:
        description: "Só conferências: sem backup, tag, deploy nem Release; a fumaça não confere a versão"
        type: boolean
        default: false

concurrency:
  group: release-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validar:
    name: Validar (main, versão, staging e ensaio da migração)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    # Banco descartável do ensaio (ADR-113): o dono se chama `estomasystech`, como em produção (superusuário).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: estomasystech
          POSTGRES_PASSWORD: ensaio
          POSTGRES_DB: estomasystech
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estomasystech" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      # ADR-092: primeiro passo, antes do checkout. Disparo errado é vermelho, nunca job pulado.
      - name: Validar o disparo (main + versão)
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != refs/heads/main ]; then
            echo "::error title=Disparo fora da main::A publicação é disparada da main (ref atual: $WORKFLOW_REF). Em Use workflow from escolha main (ADR-092)."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Versão inválida::O input version deve ser X.Y.Z (recebido: '$VERSION')."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Conferir que a main traz a versão
        shell: bash
        env:
          DISPARO_SHA: ${{ github.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$DISPARO_SHA" ]; then
            echo "::error title=A main avançou::A main mudou depois do disparo ($DISPARO_SHA -> $head). Dispare de novo."
            exit 1
          fi
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$VERSION" ]; then
            echo "::error title=Versão divergente::package.json da main traz $pkg, não $VERSION."
            exit 1
          fi
          if ! grep -Eq "^## \[?$VERSION\]?( |$)" CHANGELOG.md; then
            echo "::error title=CHANGELOG sem a versão::CHANGELOG.md não tem a seção $VERSION."
            exit 1
          fi

      # #851: só se publica o SHA exato que a staging automática validou (workflow Staging, push na main,
      # concluído com sucesso = deploy, health e validação logada verdes).
      - name: Conferir que a staging validou este SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          ok="$(gh api "repos/${GH_REPO}/actions/workflows/staging.yml/runs?head_sha=${SHA}&event=push&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error title=SHA sem validação da staging::A staging automática não tem execução verde para ${SHA}. Espere o workflow Staging terminar (ou corrija o que falhou) e dispare de novo."
            exit 1
          fi
          echo "A staging validou ${SHA}."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências do ensaio
        run: |
          npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm ci --no-audit --no-fund

      # ADR-113: o postmortem da v0.9.1 (código novo, banco velho). Banco da tag anterior -> migração pelo caminho
      # real (detectar, simular, aplicar, repetir) -> hashes iguais aos do drizzle-orm. Sem segredo, sem produção.
      - name: Ensaiar a migração (banco da versão anterior até esta)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: estomasystech
          PGPASSWORD: ensaio
          PGDATABASE: estomasystech
        run: bash scripts/release/ensaio-migracao.sh

  producao:
    name: Produção (backup, tag e deploy)
    needs: validar
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # O clique do dono: revisor único, só a main (ADR-095, decisão do dono 1). Os segredos de produção são
    # deste Environment e entram só nos passos que os usam.
    environment: producao
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      ROLLBACK: ${{ inputs.rollback }}
      GH_REPO: ${{ github.repository }}
      FUMACA_URL: ${{ vars.PRODUCAO_URL || 'https://estomasystech.kalleopinheiro.com.br' }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      # Chave SSH de migração (comando forçado ci-migrate.sh, deploy/migrate/): separada da chave de backup.
      - name: Exigir a chave de migração
        shell: bash
        env:
          VPS_MIGRATE_SSH_KEY: ${{ secrets.VPS_MIGRATE_SSH_KEY }}
        run: |
          if [ -z "$VPS_MIGRATE_SSH_KEY" ]; then
            echo "::error title=Segredo ausente::Crie VPS_MIGRATE_SSH_KEY no Environment producao (producao.md § 4.9). Sem a migração pelo dono o deploy não é seguro."
            exit 1
          fi

      - name: Exigir os segredos de produção
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          GH_TOKEN: ${{ secrets.RELEASE_CUT_TOKEN }}
        run: |
          faltam=""
          for nome in VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_HOST COOLIFY_URL COOLIFY_TOKEN COOLIFY_APP_UUID; do
            [ -n "${!nome}" ] || faltam="$faltam $nome"
          done
          [ -n "$GH_TOKEN" ] || faltam="$faltam RELEASE_CUT_TOKEN"
          if [ -n "$faltam" ]; then
            echo "::error title=Segredo ausente::Crie no Environment producao (RELEASE_CUT_TOKEN no repositório):$faltam"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # A aprovação pode demorar: se a main andou desde o disparo, o SHA validado pela staging não é mais o HEAD.
      - name: Conferir que a main não avançou
        shell: bash
        env:
          VALIDADO_SHA: ${{ github.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$VALIDADO_SHA" ]; then
            echo "::error title=A main avançou::A main mudou depois do disparo ($VALIDADO_SHA -> $head). Nada foi publicado; dispare de novo."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      # npm fixo (ADR-091): o do `packageManager` do package.json.
      - name: Fixar o npm do package.json
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      # ADR-113: o que está no ar agora é o alvo do rollback automático (a tag dessa versão). Sem alvo conhecido
      # não se troca o container. Mesma versão no ar (re-disparo): não há para onde voltar, e redeploy igual é inócuo.
      - name: Registrar a versão em produção (alvo do rollback)
        id: anterior
        shell: bash
        run: |
          ver="$(curl -fsS -m 15 "$FUMACA_URL/api/health/version" | jq -r '.version // empty')" || ver=""
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Versão em produção desconhecida::GET /api/health/version não devolveu X.Y.Z. Sem saber o que está no ar não há rollback; confira a produção antes de publicar."
            exit 1
          fi
          if [ "$ver" = "$VERSION" ]; then
            echo "::warning title=Mesma versão no ar::A produção já está na v$VERSION: re-disparo sem alvo de rollback."
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            sha="$(git rev-list -n 1 "v$ver" 2> /dev/null || true)"
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=Tag anterior ausente::A produção está na v$ver, mas a tag v$ver não existe neste repositório."
              exit 1
            fi
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi
          echo "versao=$ver" >> "$GITHUB_OUTPUT"
          echo "Produção na v$ver; esta publicação leva a v$VERSION."

      # O token do Coolify precisa ESCREVER no recurso para reverter (PATCH com o próprio valor: não muda nada).
      - name: Conferir que o rollback é possível (Coolify)
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: bash scripts/release/rollback-coolify.sh preflight

      # Só leitura: lista as migrações pendentes e prova o canal SSH de migração antes de qualquer escrita.
      - name: Detectar migrações pendentes (somente leitura)
        env:
          VPS_MIGRATE_SSH_KEY: ${{ secrets.VPS_MIGRATE_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/release/migrar-producao.sh detectar

      # ADR-039: sem backup confirmado, nada é migrado nem deployado.
      - name: Backup no VPS (BACKUP_OK)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/release/backup-vps.sh

      # ADR-113: o banco chega ao esquema novo ANTES do container novo, pelo dono, numa transação só. Falhou,
      # o job para aqui (o código antigo segue no ar sobre o esquema antigo). Termina conferindo que
      # `public.app__drizzle_migrations()`, o que o readiness lê, não deixa nada pendente.
      - name: Migrar o banco com o dono (antes do deploy)
        id: migrar
        env:
          VPS_MIGRATE_SSH_KEY: ${{ secrets.VPS_MIGRATE_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/release/migrar-producao.sh migrar

      - name: Deploy pela API do Coolify (commit conferido)
        id: deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          ESPERADO_SHA: ${{ github.sha }}
        run: bash scripts/release/deploy-coolify.sh

      # Fumaça com a versão, ainda dentro do job que tem o poder de reverter. Três tentativas: o proxy leva
      # alguns segundos para servir o container novo.
      - name: Fumaça pós-deploy (readiness e versão)
        id: fumaca_pos
        shell: bash
        run: |
          export FUMACA_VERSAO="$VERSION"
          for tentativa in 1 2 3; do
            bash scripts/release/fumaca-producao.sh && exit 0
            echo "Fumaça reprovou (tentativa $tentativa de 3)."
            [ "$tentativa" -lt 3 ] && sleep 20
          done
          exit 1

      # ADR-113: fumaça reprovada depois do deploy = produção quebrada. Volta a imagem para a versão anterior;
      # o banco fica como está (migração aditiva). O run termina vermelho de propósito.
      - name: Rollback automático da imagem (fumaça reprovou)
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.fumaca_pos.outcome == 'failure' }}
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          ROLLBACK_SHA: ${{ steps.anterior.outputs.sha }}
          VERSAO_ANTERIOR: ${{ steps.anterior.outputs.versao }}
          NAO_ADITIVAS: ${{ steps.migrar.outputs.nao_aditivas }}
          VPS_MIGRATE_SSH_KEY: ${{ secrets.VPS_MIGRATE_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        shell: bash
        run: |
          echo "::error title=Fumaça reprovou depois do deploy::Revertendo a imagem para a v$VERSAO_ANTERIOR."
          if [ -z "$ROLLBACK_SHA" ]; then
            echo "::error title=Sem alvo de rollback::A produção já estava na v$VERSION; reverta à mão (producao.md § 3.1, passos 5 e 6)."
            exit 1
          fi
          if [ -n "${NAO_ADITIVAS:-}" ] && [ "$NAO_ADITIVAS" != nenhuma ]; then
            echo "::warning title=Migrações não aditivas aplicadas::A imagem antiga roda sobre o esquema novo (${NAO_ADITIVAS}). Confirme login e busca de paciente; se falhar, restaure o backup (producao.md § 3.1, passo 6)."
          fi
          bash scripts/release/rollback-coolify.sh rollback
          # O rodapé mostra a versão mais recente de app_releases: apaga a da versão revertida.
          bash scripts/release/migrar-producao.sh desfazer-versao "$VERSION" || echo "::warning title=Rodapé::apague a versão $VERSION de app_releases à mão (producao.md § 3.1, passo 5)."
          unset FUMACA_VERSAO
          bash scripts/release/fumaca-producao.sh || echo "::error title=Depois do rollback a fumaça ainda reprova::A produção segue quebrada na v$VERSAO_ANTERIOR: ação humana agora (producao.md § 3.1)."
          echo "::error title=ROLLBACK AUTOMÁTICO EXECUTADO::A v$VERSION NÃO ficou no ar; a produção voltou para a v$VERSAO_ANTERIOR (banco com as migrações novas). A tag não foi criada."
          exit 1

      # Só com a fumaça verde a versão vira tag e Release (no re-disparo é idempotente). O PAT existe só neste
      # passo (env do passo, nunca do job) e não fica no .git/config: o git o recebe do credential helper do gh.
      - name: Publicar tag e Release (release:publish)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CUT_TOKEN }}
        run: |
          gh auth setup-git
          npm run release:publish -- --rollback="$ROLLBACK"

  fumaca:
    name: Fumaça de produção
    needs: [validar, producao]
    # No dry_run o `producao` é pulado: a fumaça roda mesmo assim, sem conferir versão.
    if: ${{ !cancelled() && needs.validar.result == 'success' && (needs.producao.result == 'success' || needs.producao.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FUMACA_URL: ${{ vars.PRODUCAO_URL || 'https://estomasystech.kalleopinheiro.com.br' }}
      CONFERIR_VERSAO: ${{ !inputs.dry_run }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Fumaça somente leitura (producao.md § 9.6)
        shell: bash
        run: |
          if [ "$CONFERIR_VERSAO" = true ]; then
            export FUMACA_VERSAO="$VERSION"
          fi
          bash scripts/release/fumaca-producao.sh
