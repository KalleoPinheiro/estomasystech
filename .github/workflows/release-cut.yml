name: Release cut

# Corte da release no Actions (ADR-071, emendada pela ADR-087): roda `npm run release:cut` em
# `release/vX.Y.Z` sem depender da máquina do operador. Só `workflow_dispatch`: escolha a branch
# `release/vX.Y.Z`. Disparo único (ADR-092): "Use workflow from" = `main` e o input `branch` = `release/vX.Y.Z`, porque a
# definição do workflow (que usa o PAT com bypass e grava o selo) tem de vir da `main` protegida. Precondição: a marca `homologacao/vX.Y.Z` no SHA da release.
# O `release:prepare` faz push do commit de versão na release e o ruleset `release/**` barra o
# GITHUB_TOKEN (o app GitHub Actions não está na bypass list). Por isso o segredo RELEASE_CUT_TOKEN
# (PAT fine-grained do dono, Contents e Pull requests: read/write, só neste repo, com bypass no
# ruleset) é OBRIGATÓRIO; sem ele o workflow falha logo no início.
# Este workflow NÃO mergeia na main, NÃO cria tag e NÃO faz deploy.
#
# ADR-088: (1) `release:preflight` roda antes de tudo e barra em ~1 min o que derrubou cortes de ~42 min
# (token, identidade git, rollback, pré-condições); com `dry_run` o workflow para aí, sem escrever nada.
# (2) A integração Postgres completa roda ANTES do `release:prepare`, no SHA homologado (o commit de versão só
# mexe em versão, CHANGELOG, changesets e lockfile), e entra como etapa `integracao` do selo.
# (3) O `release:cut` grava o check run `release-cut/gate` com o `GITHUB_TOKEN` (app github-actions: PAT não cria
# check run) no SHA final, ANTES de abrir o PR; o `ci.yml` e o `docker.yml` do PR→main e do push na main o
# conferem (e a mesma árvore) em vez de repetir a prova.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch release/vX.Y.Z a cortar (obrigatório; dispare da main, ADR-092)"
        type: string
        required: true
      rollback:
        description: "Estratégia de rollback registrada na release (ADR-071)"
        type: choice
        options: [redeploy, backup]
        default: redeploy
      dry_run:
        description: "Só o pré-voo (ADR-088): confere token, identidade, pré-condições e permissão, sem gate, sem commit e sem PR"
        type: boolean
        default: false

concurrency:
  group: release-cut
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Grava o check run `release-cut/gate` (selo do corte, ADR-088).
  checks: write

jobs:
  cut:
    name: release:cut
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # Postgres 18 para a integração completa que antecede o prepare (mesma imagem do gate-pr.yml).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: gate
          POSTGRES_DB: estomas_integ
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GH_TOKEN: ${{ secrets.RELEASE_CUT_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TZ: UTC
      # Os testes de scripts/release criam repositórios temporários e fazem merge/commit lá: precisam
      # de identidade por ambiente (o `git config` local abaixo só vale no clone principal).
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      RELEASE_BRANCH: ${{ inputs.branch }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      # ADR-092: primeiro passo, antes do checkout e do npm ci. Branch errada é vermelho, nunca job pulado.
      - name: Validar o disparo (main + release/vX.Y.Z)
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$WORKFLOW_REF" != refs/heads/main ]; then
            echo "::error title=Disparo fora da main::O corte é disparado da main (ref atual: $WORKFLOW_REF). Em Use workflow from escolha main e informe a release no input branch (ADR-092)."
            exit 1
          fi
          if ! [[ "$BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Branch de corte inválida::O input branch deve ser release/vX.Y.Z (recebido: '$BRANCH')."
            exit 1
          fi

      - name: Exigir RELEASE_CUT_TOKEN
        env:
          TOKEN: ${{ secrets.RELEASE_CUT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=RELEASE_CUT_TOKEN ausente::Crie o segredo RELEASE_CUT_TOKEN (PAT fine-grained do dono do repo, Contents e Pull requests em read/write, com bypass no ruleset release/**) em Settings > Secrets and variables > Actions e dispare de novo."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_CUT_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      # npm fixo (ADR-091): o do `packageManager` do package.json, a fonte única. O npm que vem com o Node pode
      # mudar e regenerar o lockfile sem as dependências opcionais; o `release:prepare` recusa se divergir.
      - name: Fixar o npm do package.json
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Identidade do commit de versão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Branch local igual ao origin
        run: git switch -C "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"

      - run: npm ci --no-audit --no-fund

      - name: Pré-voo (ADR-088, ADR-092)
        env:
          WORKFLOW_REF: ${{ github.ref }}
          BRANCH: ${{ inputs.branch }}
        run: npm run release:preflight -- --rollback=${{ inputs.rollback }} --workflow-ref="$WORKFLOW_REF" --branch="$BRANCH"

      - name: Navegadores do Playwright
        if: inputs.dry_run != true
        run: npx playwright install --with-deps chromium

      - name: Instalar age (smoke de backup)
        if: inputs.dry_run != true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      # Suíte inteira de integração (as combinações do lote contra Postgres real): o gate de release não a roda e
      # cada PR só a viu isolada. Vermelho aqui para o corte antes dos ~42 min do gate.
      - name: Integração Postgres completa (ADR-088)
        if: inputs.dry_run != true
        env:
          AUTH_SECRET: ci-placeholder-secret-0000000000000000
          INTEGRATION_DATABASE_URL: postgres://postgres:gate@127.0.0.1:5432/estomas_integ
          PG_POOL_MAX: "1"
        run: npx vitest run -c vitest.integracao.config.mts

      # O release:cut exige árvore limpa: se a integração sujou algo, falha aqui, com a lista, e não depois.
      - name: Árvore limpa depois da integração
        if: inputs.dry_run != true
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::a integração deixou a árvore suja; o release:cut recusaria."
            exit 1
          fi

      - name: Cortar a release
        if: inputs.dry_run != true
        env:
          # Selo do corte (ADR-088): check run só pode ser criado por GitHub App, então o selo usa o
          # GITHUB_TOKEN e não o PAT do GH_TOKEN. `integracao` rodou no passo anterior.
          SELO_TOKEN: ${{ github.token }}
          RELEASE_CUT_ETAPAS_EXTRAS: integracao
        run: npm run release:cut -- --rollback=${{ inputs.rollback }}

      - name: Guardar corpo do PR e recibo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-cut
          path: |
            .gate/
          include-hidden-files: true
          if-no-files-found: ignore
