name: Veredito do the-judge

# O the-judge de Actions (ADR-100, fase 2c do ADR-097): o veredito é montado e conferido DENTRO do mesmo job,
# com a credencial do repositório. Nenhuma sessão de agente tem como declarar um veredito: todas as PRs saem com o
# login do dono, então comentário, autor e rótulo não provam nada e este workflow não lê comentário algum.
#
# `pull_request_target` roda a versão do workflow e dos scripts da BASE (a PR não consegue trocá-los); o código da
# PR entra só como dado (checkout em `pr/`, nunca executado, sem `npm ci` dele). Alterar este arquivo é classe 3
# (workflows): exige a aprovação do dono pelo Environment (portao-risco.yml).
#
# Chave `VEREDITO_JUDGE_ATIVO`: variável do repositório (só o dono altera; a PR não alcança). Fora de `true`, o job
# passa com aviso, só para a introdução do check; com `true` ele falha fechado (sem segredo, sem resposta, com
# bloqueante, de outro SHA). `Veredito do the-judge` entra no ruleset (integration_id 15368) junto com a chave.
on:
  pull_request_target:
    branches: ["release/**", main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: veredito-judge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  veredito:
    name: Veredito do the-judge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Rascunho reprova (ADR-093)
        if: github.event.pull_request.draft == true
        run: echo "::error::PR em rascunho: o the-judge roda quando a PR for marcada como pronta (ADR-093)"; exit 1

      - name: Chave de introdução desligada
        id: chave
        env:
          ATIVO: ${{ vars.VEREDITO_JUDGE_ATIVO }}
        run: |
          echo "ativo=$([ "$ATIVO" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$ATIVO" = true ] || echo "::warning::VEREDITO_JUDGE_ATIVO não é 'true': o veredito do the-judge NÃO está sendo exigido (ADR-100)"

      # Base (confiável): scripts e dependências.
      - if: steps.chave.outputs.ativo == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - if: steps.chave.outputs.ativo == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - if: steps.chave.outputs.ativo == 'true'
        run: npm ci --ignore-scripts

      # Head da PR (não confiável): só para gerar o diff. Nada dele é executado.
      - if: steps.chave.outputs.ativo == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Julgar e conferir
        if: steps.chave.outputs.ativo == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTOR: ${{ github.event.pull_request.user.login }}
          PR_TITULO: ${{ github.event.pull_request.title }}
          BASE: origin/${{ github.base_ref }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::segredo ANTHROPIC_API_KEY ausente: sem o julgamento não há aprovação"; exit 1; }
          git -C pr diff --no-ext-diff --no-textconv "$BASE...$PR_SHA" > "$RUNNER_TEMP/pr.diff"
          npx tsx scripts/release/julgar-pr.ts --diff "$RUNNER_TEMP/pr.diff" --saida "$RUNNER_TEMP/veredito.json"
          REVISOR="actions/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          {
            echo "### Veredito do the-judge"
            echo '```json'
            cat "$RUNNER_TEMP/veredito.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npx tsx scripts/release/veredito-judge.ts --autor "$PR_AUTOR" --sha "$PR_SHA" \
            --arquivo "$RUNNER_TEMP/veredito.json" --revisor-esperado "$REVISOR"
