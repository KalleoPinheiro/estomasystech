name: Veredito do the-judge

# ADR-109 (simplificação do fluxo): o the-judge deixou de ser portão mecânico. O CI é o revisor de toda mudança
# comum; o diff perigoso (login, cifra, escopo de empresa, migração não aditiva, portão e deploy) exige o clique do
# dono no check "Portão de risco" (`portao-risco.yml`) e, antes dele, a revisão do the-judge na própria sessão.
# Este arquivo existe só para manter o nome do check que o ruleset da `main` ainda exige; quando o dono o tirar do
# ruleset, o arquivo pode ser apagado.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  veredito:
    name: Veredito do the-judge
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: |
          echo "ok - sem portão mecânico do the-judge (ADR-109); o perigoso passa pelo Portão de risco"
