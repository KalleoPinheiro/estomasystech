name: CI

# Só o gate rápido roda aqui (ADR-042). O E2E é o `gate:local`, conferido por recibo em
# `recibo-gate.yml`; o Docker está em `docker.yml`, só quando o que ele valida muda.
# A `staging` não dispara CI: é espelho da `main` + features que já passaram no PR.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runner fixado em ubuntu-24.04: o rótulo ubuntu-latest passa a ser Ubuntu 26 a partir de
# 2026-10-19 (actions/runner-images#14748). Trocar de imagem vira uma mudança explícita,
# validada num PR próprio, e não uma surpresa no meio do go-live.

jobs:
  ci:
    name: Typecheck, lint, sv-gate, test:coverage, build
    runs-on: ubuntu-24.04
    env:
      AUTH_SECRET: ci-placeholder-secret-0000000000000000
      # O `tsc --noEmit` estourava o heap padrão (~2 GB, exit 134). O runner tem 16 GB; 8192 é o
      # mesmo teto do gate local e da nuvem (scripts/gate-cloud.sh).
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # O PR `release/* → main` consome os changesets no commit de versão (ADR-052): não exige novo.
      - name: Changeset (ADR-043)
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: npm run check:changeset
        env:
          CHANGESET_BASE: origin/${{ github.base_ref }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: still-void adoption gate
        run: npm run check:sv

      - name: Docs gate
        run: npm run check:docs

      - name: Server-first gate
        run: npm run check:server-first

      - name: Test (coverage)
        run: npm run test:coverage

      # Build de produção (1,5 min): barra erro de compilação sem pagar o E2E.
      - name: Build
        run: npm run build
