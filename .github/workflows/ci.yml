name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runner fixado em ubuntu-24.04: o rótulo ubuntu-latest passa a ser Ubuntu 26 a partir de
# 2026-10-19 (actions/runner-images#14748). Trocar de imagem vira uma mudança explícita,
# validada num PR próprio, e não uma surpresa no meio do go-live.

jobs:
  ci:
    name: Typecheck, lint, sv-gate, test:coverage
    runs-on: ubuntu-24.04
    env:
      AUTH_SECRET: ci-placeholder-secret-0000000000000000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: still-void adoption gate
        run: npm run check:sv

      - name: Docs gate
        run: npm run check:docs

      - name: Test (coverage)
        run: npm run test:coverage

  e2e:
    name: E2E (Playwright, papéis no next dev)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: "Test (e2e: papéis e login, contra o next dev)"
        run: npm run test:e2e:dev

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Issues #203 e #308: o artefato que vai para produção é verificado antes do
  # deploy. Build de produção (bloqueante) + E2E principal contra `next start`,
  # com a CSP estrita de produção e falha em qualquer violação de CSP. O `next dev`
  # (job acima) fica só com o que depende dele: contas por papel e login.
  build-e2e-prod:
    name: Build de produção + E2E (next start)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test (e2e contra o build de produção)
        run: npx playwright test -c playwright.prod.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-prod
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Imagem Docker + smoke do container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Docker build (sem push)
        env:
          # O compose valida as variáveis obrigatórias até no build.
          POSTGRES_PASSWORD: build-only
          AUTH_SECRET: build-only
          DATA_ENCRYPTION_KEY: build-only
          RESEND_API_KEY: build-only
          EMAIL_FROM: build-only
        run: docker compose build

      - name: Smoke do container
        run: bash scripts/docker-smoke.sh

      # Backup cifrado + restore contra o compose (#206, runbook § 5).
      - name: Instalar age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Smoke do backup/restore
        run: bash scripts/backup-smoke.sh
