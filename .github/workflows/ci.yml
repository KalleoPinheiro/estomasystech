name: CI

# Só o gate rápido roda aqui. O E2E e a mutação por arquivo alterado ficam em `gate-pr.yml` (ADR-098, que
# supera o ADR-042); a integridade dos testes, em `recibo-gate.yml`; o Docker, em `docker.yml`, só quando o
# que ele valida muda.
# A `staging` não dispara CI: é espelho da `main` + features que já passaram no PR.
#
# Jobs em paralelo (ADR-087): verificações estáticas, cobertura em 4 shards do Vitest (com junção do
# relatório e os limiares de sempre) e build andam juntos. O job `ci` no fim mantém o nome do check
# exigido pelo ruleset e só passa se TODOS os de cima passaram: shard, cache ou paralelo nenhum mascara falha.
on:
  push:
    branches: [main]
  pull_request:
    # ADR-093: sem types o ready_for_review não dispara, e o vermelho do rascunho ficaria no SHA.
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue (ADR-087): o gate roda no SHA que a fila vai mergear, não no do PR isolado.
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Lê o check run `release-cut/gate` do SHA provado pelo corte (ADR-088).
  checks: read

# Runner fixado em ubuntu-24.04: o rótulo ubuntu-latest passa a ser Ubuntu 26 a partir de
# 2026-10-19 (actions/runner-images#14748). Trocar de imagem vira uma mudança explícita,
# validada num PR próprio, e não uma surpresa no meio do go-live.

jobs:
  # Escopo do PR (ADR-087): PR só de documentação (mesma regra do ADR-053, `scripts/release/docs-only.ts`) não
  # paga typecheck, lint, cobertura nem build; roda só o gate de docs. Não se usa `paths-ignore` no gatilho:
  # um workflow que nem começa deixa o check exigido do ruleset pendente para sempre e trava o merge. Aqui o
  # workflow roda, os jobs pesados são pulados e o job `ci` (o check exigido) confere e reporta sucesso.
  escopo:
    name: Escopo (só documentação?)
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classe.outputs.docs_only }}
      provado: ${{ steps.prova.outputs.provado }}
      pesado: ${{ steps.pesado.outputs.pesado }}
      completo: ${{ steps.pesado.outputs.completo }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --ignore-scripts

      # Só PR pode ser dispensado; push na `main` e fila de merge rodam tudo.
      - id: classe
        env:
          EVENTO: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENTO" = pull_request ]; then
            npx tsx scripts/release/docs-only.ts --base "origin/$BASE_REF" --head "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          echo "docs_only=$(grep -h '^docs_only=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" >> "$GITHUB_STEP_SUMMARY"

      # Prova do corte (ADR-088): PR `release/vX.Y.Z → main` e push do merge na `main` cujo segundo pai tem o
      # check run `release-cut/gate` (app github-actions, success, com as etapas do CI) e a MESMA árvore. Qualquer
      # dúvida (selo ausente, árvore diferente, API fora) dá `provado=false` e o CI roda inteiro.
      - id: prova
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx tsx scripts/release/prova-corte.ts --evento "$EVENTO" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --head-sha "$HEAD_SHA" --resumo "$GITHUB_STEP_SUMMARY" --etapas ci | tee -a "$GITHUB_OUTPUT"

      # `pesado=true` roda estático completo, cobertura e build; só documentação ou prova do corte os dispensa.
      # ADR-093: rascunho não paga estático, cobertura nem build. `completo=false` só em pull_request draft.
      - id: pesado
        env:
          DOCS_ONLY: ${{ steps.classe.outputs.docs_only }}
          PROVADO: ${{ steps.prova.outputs.provado }}
          EVENTO: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENTO" = pull_request ] && [ "$DRAFT" = true ]; then completo=false; else completo=true; fi
          if [ "$completo" != true ] || [ "$DOCS_ONLY" = true ] || [ "$PROVADO" = true ]; then pesado=false; else pesado=true; fi
          {
            echo "completo=$completo"
            echo "pesado=$pesado"
          } >> "$GITHUB_OUTPUT"
          echo "docs_only=$DOCS_ONLY provado_pelo_corte=${PROVADO:-false} rascunho=${DRAFT:-n/a} completo=$completo pesado=$pesado" >> "$GITHUB_STEP_SUMMARY"

  estatico:
    name: Estático (changeset, typecheck, lint, sv, docs, server-first)
    needs: escopo
    if: needs.escopo.outputs.completo == 'true' && needs.escopo.outputs.provado != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTH_SECRET: ci-placeholder-secret-0000000000000000
      # O `tsc --noEmit` estourava o heap padrão (~2 GB, exit 134). O runner tem 16 GB; 8192 é o
      # mesmo teto do gate local e da nuvem (scripts/gate-cloud.sh).
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # O PR `release/* → main` consome os changesets no commit de versão (ADR-052): não exige novo.
      - name: Changeset (ADR-043)
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: npm run check:changeset
        env:
          CHANGESET_BASE: origin/${{ github.base_ref }}

      # Handoff por issue (ADR-102): arquivo novo por PR, sem conflito no merge.
      - name: Handoff (ADR-102)
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: npm run check:handoff
        env:
          CHANGESET_BASE: origin/${{ github.base_ref }}

      # Posse da issue (ADR-104): dono:claude ou dono:cursor, igual ao agente que escreveu o PR.
      - name: Posse (ADR-104)
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: npm run check:posse
        env:
          CHANGESET_BASE: origin/${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Typecheck
        if: needs.escopo.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Lint
        if: needs.escopo.outputs.docs_only != 'true'
        run: npm run lint

      - name: still-void adoption gate
        if: needs.escopo.outputs.docs_only != 'true'
        run: npm run check:sv

      - name: Docs gate
        run: npm run check:docs

      # Dependências de produção sem vulnerabilidade alta ou crítica (#717). As de desenvolvimento ficam
      # fora de propósito: a triagem delas é a de docs/engineering/security-scan.md § Triagem do npm audit.
      - name: Audit de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Server-first gate
        if: needs.escopo.outputs.docs_only != 'true'
        run: npm run check:server-first

      # Lint de migração aditiva (fase 2b, #755): erro estrutural reprova; migração não aditiva é decisão de classe 3.
      - name: Migração aditiva (check:migracao)
        if: github.event_name == 'pull_request'
        run: npm run check:migracao
        env:
          GATE_BASE: origin/${{ github.base_ref }}

      # `import()` com template literal faz o Vite avisar e esconde avisos reais (#646).
      - name: Dynamic-import gate
        if: needs.escopo.outputs.docs_only != 'true'
        run: npx tsx scripts/check-dynamic-import.ts

  # O `gate:local` roda o `check:server-first` e o `check:dynamic-import` (#698), mas o selo do corte só exige as
  # etapas de `ETAPAS_CI` (scripts/release/prova-corte-lib.ts), que não os incluem: um selo sem eles ainda é aceito.
  # Por isso, no PR provado pelo corte, este job barato (checkout + install + dois scripts) mantém a garantia que o `estatico`
  # dava (ADR-088, emenda ADR-092). Todo step do `estatico` fora do selo tem de aparecer aqui: o teste
  # tests/infrastructure/ci-fora-do-selo.test.ts reprova o contrário.
  fora-do-selo:
    name: Fora do selo (server-first e dynamic-import, PR provado)
    needs: escopo
    if: needs.escopo.outputs.completo == 'true' && needs.escopo.outputs.provado == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Server-first gate
        run: npm run check:server-first

      - name: Dynamic-import gate
        run: npx tsx scripts/check-dynamic-import.ts

      # Também no PR provado: o selo não cobre o handoff por issue (ADR-102).
      - name: Handoff (ADR-102)
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: npm run check:handoff
        env:
          CHANGESET_BASE: origin/${{ github.base_ref }}

      # Posse da issue (ADR-104): dono:claude ou dono:cursor, igual ao agente que escreveu o PR.
      - name: Posse (ADR-104)
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: npm run check:posse
        env:
          CHANGESET_BASE: origin/${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Migração aditiva (check:migracao)
        if: github.event_name == 'pull_request'
        run: npm run check:migracao
        env:
          GATE_BASE: origin/${{ github.base_ref }}

      - name: Audit de produção
        run: npm audit --omit=dev --audit-level=high

  # Cobertura em 4 fatias (vitest --shard). Cada fatia roda os testes dela e grava um blob com o relatório e a
  # cobertura bruta; os limiares só valem na junção (`cobertura`), com a config da suíte inteira. Teste
  # vermelho em qualquer fatia reprova a fatia e, por `needs`, o gate.
  cobertura-shard:
    name: Cobertura (shard ${{ matrix.shard }}/4)
    needs: escopo
    if: needs.escopo.outputs.pesado == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      AUTH_SECRET: ci-placeholder-secret-0000000000000000
      NODE_OPTIONS: --max-old-space-size=8192
      # O runner não tem identidade git: tests/scripts/release-fluxo.test.ts roda `sync-main.sh`
      # (git merge) e falhava com "Author identity unknown".
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Testes do shard (com cobertura bruta)
        run: >-
          npx vitest run -c vitest.shard.config.mts --coverage --reporter=blob
          --shard=${{ matrix.shard }}/4

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          if-no-files-found: error
          # `.vitest-reports` é pasta oculta: sem isto o upload-artifact v4 a ignora.
          include-hidden-files: true
          retention-days: 1

  cobertura:
    name: Cobertura (junção e limiares)
    needs: cobertura-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUTH_SECRET: ci-placeholder-secret-0000000000000000
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      # Confere que as 4 fatias chegaram: um blob a menos esconderia testes e cobertura.
      - name: Quatro blobs
        run: test "$(ls .vitest-reports/blob-*.json | wc -l)" -eq 4

      # Config da suíte inteira: os limiares de vitest.config.mts (100% nas camadas de regra, piso 90).
      - name: Junção e limiares
        run: npx vitest --merge-reports --coverage

  # Nome antigo do job, exigido pelo ruleset: continua sendo o único check a exigir. Confere que TODOS os
  # jobs acima passaram (nada pulado, cancelado ou falho) e roda o build de produção (1,5 min), que barra
  # erro de compilação sem pagar o E2E.
  ci:
    name: Typecheck, lint, sv-gate, test:coverage, build
    if: always()
    needs: [escopo, estatico, fora-do-selo, cobertura-shard, cobertura]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUTH_SECRET: ci-placeholder-secret-0000000000000000
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      # Código: todos os jobs têm de ser `success`. Só documentação: o escopo e o estático (gate de docs) passam
      # e os jobs pesados têm de estar `skipped`. Provado pelo corte (ADR-088): só o escopo passa e TUDO o mais
      # tem de estar `skipped`, menos o `fora-do-selo`, que tem de passar. Qualquer outra combinação reprova.
      - name: Todos os jobs anteriores passaram
        env:
          COMPLETO: ${{ needs.escopo.outputs.completo }}
          DOCS_ONLY: ${{ needs.escopo.outputs.docs_only }}
          PROVADO: ${{ needs.escopo.outputs.provado }}
          R_ESCOPO: ${{ needs.escopo.result }}
          R_ESTATICO: ${{ needs.estatico.result }}
          R_FORADOSELO: ${{ needs.fora-do-selo.result }}
          R_SHARD: ${{ needs.cobertura-shard.result }}
          R_COBERTURA: ${{ needs.cobertura.result }}
        run: |
          echo "completo=$COMPLETO docs_only=$DOCS_ONLY provado=$PROVADO escopo=$R_ESCOPO estatico=$R_ESTATICO foradoselo=$R_FORADOSELO shard=$R_SHARD cobertura=$R_COBERTURA"
          if [ "$COMPLETO" != true ]; then
            echo "::error::PR em rascunho: o CI completo roda quando o PR for marcado como pronto (ADR-093)"
            exit 1
          fi
          [ "$R_ESCOPO" = success ] || { echo "::error::o escopo não passou"; exit 1; }
          if [ "$PROVADO" = true ]; then
            [ "$R_ESTATICO" = skipped ] && [ "$R_SHARD" = skipped ] && [ "$R_COBERTURA" = skipped ] || { echo "::error::PR provado pelo corte não devia ter rodado estático nem cobertura"; exit 1; }
            [ "$R_FORADOSELO" = success ] || { echo "::error::fora-do-selo (server-first e dynamic-import) não passou no PR provado"; exit 1; }
            echo "Provado pelo release-cut/gate no mesmo SHA e na mesma árvore (ADR-088): sem repetir."
            exit 0
          fi
          [ "$R_FORADOSELO" = skipped ] || { echo "::error::fora-do-selo do PR provado não devia ter rodado"; exit 1; }
          [ "$R_ESTATICO" = success ] || { echo "::error::estático não passou"; exit 1; }
          if [ "$DOCS_ONLY" = true ]; then
            [ "$R_SHARD" = skipped ] && [ "$R_COBERTURA" = skipped ] || { echo "::error::PR de documentação não devia ter rodado cobertura"; exit 1; }
          else
            [ "$R_SHARD" = success ] && [ "$R_COBERTURA" = success ] || { echo "::error::cobertura não passou"; exit 1; }
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.escopo.outputs.pesado == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.escopo.outputs.pesado == 'true'
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: needs.escopo.outputs.pesado == 'true'
        run: npm ci

      # Cache do Next entre rodadas: só acelera a compilação; o build roda inteiro e falha igual.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: needs.escopo.outputs.pesado == 'true'
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Build
        if: needs.escopo.outputs.pesado == 'true'
        run: npm run build
