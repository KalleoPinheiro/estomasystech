# Produção em VPS (#206): Caddy na frente do app, terminando TLS.
# Use junto do docker-compose.yml, de preferência fixando no .env do host:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
# Roteiro: docs/engineering/producao.md.
services:
  app:
    # O app deixa de ser publicado no host: só o Caddy fala com ele, pela rede
    # do compose. Exposto direto, o HTTP sem TLS e o x-forwarded-for forjado
    # chegariam ao app (o rate limit confia no último salto, TRUSTED_PROXY_HOPS).
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?defina APP_DOMAIN (ex. clinica.exemplo.com.br)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados e chaves do ACME: sem volume, cada recriação pede um
      # certificado novo e esbarra no limite do Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
