# Produção em VPS (#206, ADR-036): o Traefik do Coolify é o único porteiro (80/443, TLS Let's
# Encrypt). Use junto do docker-compose.yml. No Coolify, aponte o recurso para os dois arquivos
# ("Docker Compose Location": docker-compose.yml:docker-compose.prod.yml) ou fixe no .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
# Roteiro: docs/engineering/producao.md.
services:
  app:
    # Sem porta no host: só o Traefik fala com o app, pela rede do Docker. Exposto direto, o
    # HTTP sem TLS e o x-forwarded-for forjado chegariam ao app (o rate limit confia no último
    # salto, TRUSTED_PROXY_HOPS=1 atrás do Traefik).
    ports: !reset []
    expose:
      - "3000"
    environment:
      # Variável mágica do Coolify: cria o domínio do app (porta 3000) e as labels do Traefik.
      SERVICE_FQDN_APP_3000: ${SERVICE_FQDN_APP_3000:-}
    # Middlewares compartilhados do Traefik do Coolify (shared-middlewares.yaml, provider file).
    # A label coolify.traefik.middlewares é anexada às rotas que o Coolify gera para o domínio.
    labels:
      - coolify.traefik.middlewares=rate-limit-app@file,security-headers@file

  db:
    # Postgres só na rede interna do compose: nenhuma porta publicada no host.
    ports: !reset []
