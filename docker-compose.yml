services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estomasystech
      # Sem senha fixa (#191): a subida falha se POSTGRES_PASSWORD não existir.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (ex. openssl rand -hex 24)}
      POSTGRES_DB: estomasystech
    # Só no loopback do host (#191): o app fala com o banco pela rede interna do
    # compose; a porta local existe apenas para a Via B do onboarding (npm run
    # dev contra este banco). Nunca publicado em todas as interfaces.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estomasystech -d estomasystech"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://estomasystech:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/estomasystech
      TZ: ${TZ:-America/Sao_Paulo}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET (ex. openssl rand -hex 32)}
      # Chave do dado clínico em repouso (#195, ADR-006) — separada do AUTH_SECRET.
      # Perdê-la é perder o prontuário cifrado: guarde-a fora do backup do banco.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?defina DATA_ENCRYPTION_KEY (ex. openssl rand -hex 32)}
      # Chaves anteriores (só leitura) durante a rotação — ver docs/engineering/producao.md.
      DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}
      # Pepper do índice cego da PII (#734, ADR-096) — separado da chave de dados; só runtime.
      BLIND_INDEX_PEPPER: ${BLIND_INDEX_PEPPER:?defina BLIND_INDEX_PEPPER (ex. openssl rand -hex 32)}
      BLIND_INDEX_PEPPER_PREVIOUS: ${BLIND_INDEX_PEPPER_PREVIOUS:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # E-mail da plataforma (opcional, ADR-011): só contas sem clínica. Sem elas o
      # canal da plataforma fica desativado e o bootstrap devolve o link em inviteUrl.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Libera POST /api/auth/bootstrap enquanto a instalação não tem nenhuma conta.
      ESTOMASYSTECH_BOOTSTRAP_TOKEN: ${ESTOMASYSTECH_BOOTSTRAP_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      # Fotos em bucket S3-compatível (vazio = disco local, volume abaixo).
      PHOTO_STORAGE: ${PHOTO_STORAGE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      # Cifra das fotos no bucket: AES256 (padrão), aws:kms ou provider.
      S3_SSE: ${S3_SSE:-}
      # Fotos em disco local: sempre dentro do volume `uploads` abaixo.
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      # Job de lembretes (POST /api/reminders/run): sem ele a rota responde 503.
      CRON_SECRET: ${CRON_SECRET:-}
      # Proxies reversos confiáveis à frente do app (Nginx/Traefik = 1, Cloudflare + Nginx = 2).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-}
      ESTOMASYSTECH_MIGRATE_ON_BOOT: ${ESTOMASYSTECH_MIGRATE_ON_BOOT:-}
      PG_POOL_MAX: ${PG_POOL_MAX:-}
      PG_CONNECT_TIMEOUT_MS: ${PG_CONNECT_TIMEOUT_MS:-}
      PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS:-}
      PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-}
      # Observabilidade (#212): GlitchTip (vazio = sem error tracking) e alertas
      # por e-mail ao operador pelo canal da plataforma (RESEND_API_KEY/EMAIL_FROM).
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      APP_RELEASE: ${APP_RELEASE:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_5XX_THRESHOLD: ${ALERT_5XX_THRESHOLD:-}
      ALERT_DELIVERY_FAILURE_THRESHOLD: ${ALERT_DELIVERY_FAILURE_THRESHOLD:-}
    volumes:
      # Fotos clínicas fora da camada gravável do container (#191): sem isto
      # elas somem no próximo `docker compose up --build` (perda de prontuário).
      - uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
